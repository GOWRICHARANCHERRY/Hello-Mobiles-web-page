<!DOCTYPE html>
<html lang="en" style="background-color: #fffdf5">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="256x256" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello Mobiles — Mobile Phones, Electronics & Gadgets in Nellore district</title>
    <meta name="description" content="Hello Mobiles — Your one-stop shop for mobile phones, electronics, laptops, TVs, and gadgets in Allur and Buchireddypalem, Nellore district. Best prices, EMI options, and home delivery." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hello Mobiles — Mobile Phones, Electronics & Gadgets in Nellore district" />
    <meta property="og:description" content="Best prices on mobile phones, electronics, laptops, TVs, and gadgets in Allur and Buchireddypalem, Nellore district. EMI options and home delivery." />
    <meta property="og:url" content="https://hello-mobiles.com" />
    <meta property="og:image" content="https://hello-mobiles.com/logo.png" />
    <meta property="og:site_name" content="Hello Mobiles" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#D97706" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" as="style" id="gfonts-preload" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fdn2.gsmarena.com" />
    <link rel="preconnect" href="https://apis.google.com" />
    <link rel="preconnect" href="https://cdn.simpleicons.org" />
    <script src="/fonts.js" defer></script>
    <script src="/boot.js" defer></script>
    <style>
      /* Inline so the page never renders black/blank while (or if) the JS/CSS bundle loads. */
      html, body { margin: 0; background-color: #fffdf5; }
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #fffdf5; font-family: system-ui, -apple-system, sans-serif; color: #444; text-align: center; padding: 24px;
      }
      #boot.hm-hidden { display: none; }
      #boot .hm-spin {
        width: 40px; height: 40px; border: 4px solid #f3e0a0; border-top-color: #d97706;
        border-radius: 50%; animation: hm-rotate 0.9s linear infinite; margin-bottom: 14px;
      }
      @keyframes hm-rotate { to { transform: rotate(360deg); } }
      #boot .hm-retry-title { font-weight: 600; font-size: 16px; }
      #boot .hm-retry-sub { font-size: 13px; color: #777; margin: 8px 0 16px; max-width: 280px; line-height: 1.5; }
      #boot button { background: #d97706; color: #fff; border: 0; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <div class="hm-spin"></div>
      <div>Loading Hello Mobiles…</div>
    </div>
    <noscript>
      <div style="position:fixed;inset:0;background:#fffdf5;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#444;text-align:center;padding:24px">
        Please enable JavaScript to use Hello Mobiles.
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
